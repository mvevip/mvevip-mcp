AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Rol que asume GitHub Actions (OIDC) para desplegar mvevip-mcp. Se despliega UNA sola vez,
  manualmente, con un administrador de la cuenta AWS de producción.

Parameters:
  GitHubRepo:
    Type: String
    Default: mvevip/mvevip-mcp
  GitHubOwner:
    Type: String
    Default: mvevip
  GitHubOwnerId:
    Type: String
    Default: '344858672'
  GitHubRepoName:
    Type: String
    Default: mvevip-mcp
  GitHubRepoId:
    Type: String
    Default: '1430282490'
  GitHubEnvironment:
    Type: String
    Default: production
  FunctionName:
    Type: String
    Default: mvevip-mcp-server
  StackName:
    Type: String
    Default: mvevip-mcp
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Poner 'false' si la cuenta ya tiene el proveedor token.actions.githubusercontent.com

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${FunctionName}-github-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Solo el job del environment "production" de este repositorio
                # GitHub puede emitir el sub por nombre o, si la organización lo tiene activado, con IDs numéricos
                # (repo:<owner>@<owner_id>/<repo>@<repo_id>:environment:...). Se aceptan ambos formatos.
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepo}:environment:${GitHubEnvironment}
                  - !Sub repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepoName}@${GitHubRepoId}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: deploy-mvevip-mcp
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationStack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:GetTemplateSummary
                Resource: !Sub arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/${StackName}/*
              - Sid: LambdaFunction
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:PublishVersion
                  - lambda:CreateFunctionUrlConfig
                  - lambda:UpdateFunctionUrlConfig
                  - lambda:GetFunctionUrlConfig
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  - lambda:TagResource
                  - lambda:ListTags
                Resource: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:${FunctionName}
              - Sid: ExecutionRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:PutRolePolicy
                  - iam:TagRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${FunctionName}-exec
              - Sid: CloudFrontDistribution
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:TagResource
                  - cloudfront:ListTagsForResource
                  - cloudfront:CreateOriginRequestPolicy
                  - cloudfront:UpdateOriginRequestPolicy
                  - cloudfront:GetOriginRequestPolicy
                  - cloudfront:GetCachePolicy
                Resource: '*'
              - Sid: SesIdentity
                Effect: Allow
                Action:
                  - ses:CreateEmailIdentity
                  - ses:GetEmailIdentity
                  - ses:PutEmailIdentityDkimAttributes
                  - ses:TagResource
                  - ses:ListTagsForResource
                Resource: '*'
              - Sid: LogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DescribeLogGroups
                  - logs:TagResource
                Resource: '*'
              - Sid: VpcNetworkingForLambda
                Effect: Allow
                Action:
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                Resource: '*'

Outputs:
  DeployRoleArn:
    Description: Guardar como variable AWS_DEPLOY_ROLE_ARN en el environment "production" de GitHub
    Value: !GetAtt DeployRole.Arn
