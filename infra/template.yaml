AWSTemplateFormatVersion: '2010-09-09'
Description: MVEVIP Remote MCP Server (Lambda + Function URL BUFFERED)

Parameters:
  FunctionName:
    Type: String
    Default: mvevip-mcp-server
  McpAccessKey:
    Type: String
    NoEcho: true
    MinLength: 16
  McpSigningSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  McpClientId:
    Type: String
    Default: mvevip_claude_connector
  DbHost:
    Type: String
  DbPort:
    Type: String
    Default: '3306'
  DbUser:
    Type: String
  DbPassword:
    Type: String
    NoEcho: true
  DbName:
    Type: String
  DbSsl:
    Type: String
    Default: ''
    AllowedValues: ['', 'rds', 'true']
  VpcSubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Subnets privadas si la BD solo es accesible desde la VPC (vacío = sin VPC)
  VpcSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ''

Conditions:
  UseVpc: !Not [!Equals [!Join ['', !Ref VpcSubnetIds], '']]

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${FunctionName}
      RetentionInDays: 30

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${FunctionName}-exec
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !If
          - UseVpc
          - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: nodejs24.x
      Handler: lambda.handler
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt ExecutionRole.Arn
      # El código real lo sube el workflow (aws lambda update-function-code).
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 503, body: 'pending deploy' });
      Environment:
        Variables:
          NODE_ENV: production
          TRUST_PROXY_HOPS: '1'
          MCP_ACCESS_KEY: !Ref McpAccessKey
          MCP_SIGNING_SECRET: !Ref McpSigningSecret
          MCP_CLIENT_ID: !Ref McpClientId
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          DB_NAME: !Ref DbName
          DB_SSL: !Ref DbSsl
          DB_CONNECTION_LIMIT: '2'
      VpcConfig: !If
        - UseVpc
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  UrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

Outputs:
  FunctionUrl:
    Value: !GetAtt FunctionUrl.FunctionUrl
  ConnectorUrl:
    Description: URL a registrar en Claude (Personalizar > Conectores)
    Value: !Sub '${FunctionUrl.FunctionUrl}mcp'
