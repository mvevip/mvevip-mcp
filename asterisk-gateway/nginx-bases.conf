# nginx del servidor (ya ocupa el puerto 80). Copiar a /etc/nginx/sites-available/bases.mvevip.com,
# enlazar en sites-enabled, probar con `sudo nginx -t` y recargar. Luego: sudo certbot --nginx -d bases.mvevip.com
server {
    listen 80;
    server_name bases.mvevip.com;

    client_max_body_size 300k;

    location = /health {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /cdr/resumen {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # el servicio limita por IP: se sobrescribe (no se agrega) para que no se pueda falsificar
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
